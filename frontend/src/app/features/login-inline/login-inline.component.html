<div class="hero-right">
  <div class="login-card">
    <h3>Sign in</h3>

    <form (ngSubmit)="submitInline()" #inlineForm="ngForm" novalidate>

      <div class="form-group">
        <label for="inlineEmail">Email</label>
        <input
          id="inlineEmail"
          name="email"
          [(ngModel)]="email"
          type="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="inlinePassword">Password</label>
        <input
          id="inlinePassword"
          name="password"
          [(ngModel)]="password"
          type="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button
        class="login-btn"
        type="submit"
        [disabled]="inlineForm.invalid"
      >
        Log in
      </button>
      <div class="small-muted">
        No backend required — demo only
      </div>
    </form>
  </div>
</div>
