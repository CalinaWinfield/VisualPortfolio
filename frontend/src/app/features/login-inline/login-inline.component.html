<div class="login-card">
  <h3 class="mb-3">Sign in</h3>

  <form (ngSubmit)="submitInline()" #inlineForm="ngForm" novalidate>
    <div class="mb-3">
      <label for="inlineEmail" class="form-label">Email</label>
      <input id="inlineEmail" name="email" [(ngModel)]="email" type="email" class="form-control" placeholder="you@example.com" required>
    </div>

    <div class="mb-3">
      <label for="inlinePassword" class="form-label">Password</label>
      <input id="inlinePassword" name="password" [(ngModel)]="password" type="password" class="form-control" placeholder="••••••••" required>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </div>
      <div class="small-muted">No backend required — demo only</div>
    </div>
  </form>
</div>
