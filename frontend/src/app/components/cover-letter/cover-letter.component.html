
<div class="dashboard container-fluid">
  <header class="mobile-header d-md-none text-center py-3">
    <div class="user-profile">
      <div class="profile-picture mx-auto"></div>
      <div class="user-details mt-2">
        <p class="user-name fw-bold mb-0">{{ userProfile.name }}</p>
        <p class="user-email mb-0">{{ userProfile.email }}</p>
      </div>
    </div>
  </header>

  <main class="main-section col-md-8 col-12" style="position:relative;">
    <h1 class="greeting mb-4">Let's build your Cover Letter</h1>

    <div class="template-selection mb-4">
      <h2>Choose a Template</h2>
      <div class="row">
        <div class="col-md-4" *ngFor="let template of [1, 2, 3]">
          <div class="template-card">
            <img src="assets/img/cover{{ template }}.png" [alt]="'Template ' + template" class="img-fluid"/>
            <button class="btn btn-primary mt-2 covbtn" (click)="loadTemplate(template)">
              Use This Template
            </button>
          </div>
        </div>
      </div>

    <div class="cover-letter-editor">
      <h2>Your Cover Letter</h2>
      <p class="text-success fw-bold" *ngIf="templateStatus">{{ templateStatus }}</p>

      <textarea
        class="form-control mb-3"
        [(ngModel)]="currentLetter.introduction"
        rows="5"
        placeholder="Introduction...">
      </textarea>

      <textarea
        class="form-control mb-3"
        [(ngModel)]="currentLetter.body"
        rows="5"
        placeholder="Body...">
      </textarea>

      <textarea
        class="form-control mb-3"
        [(ngModel)]="currentLetter.conclusion"
        rows="5"
        placeholder="Conclusion...">
      </textarea>

      <button class="btn btn-success" (click)="saveLetter()">Save</button>
      <button class="btn btn-primary" (click)="previewLetter()">Preview</button>
      <button class="btn btn-secondary" (click)="exportLetter()">Export as PDF</button>
    </div>
</div>
  </main>
</div>
