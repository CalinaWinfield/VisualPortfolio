<div class="container py-5">
  <h2 class="mb-4 text-center">Create your EasyFolio account</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto" style="max-width: 400px;">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input id="name" type="text" class="form-control" formControlName="name">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password">
    </div>

    <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Signing up...' : 'Sign Up' }}
    </button>

    <p class="mt-3 text-center">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>
  </form>
</div>
