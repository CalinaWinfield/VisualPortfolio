<div class="signup-page container">

  <h2 class="signup-title text-center">
    Create your Visual Portfolio account
    <hr>
  </h2>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="signup-form mx-auto"
  >
<h3 class="signup-name">Sign Up</h3>
    <!-- Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input id="name" type="text" class="form-control" formControlName="name">

      <div class="text-danger"
           *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
        Name is required
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email">

      <div class="text-danger"
           *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched">
        Enter a valid email address
      </div>

      <div class="text-danger"
           *ngIf="form.get('email')?.hasError('pattern') && form.get('email')?.touched">
        Email must end with &#64;ggc.edu
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>

      <div class="input-group">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="password"
        />

        <button
          type="button"
          class="btn-eye"
          [ngClass]="{ 'active': showPassword }"
          (click)="showPassword = !showPassword"
        >
          <i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
        </button>
      </div>

      <div class="text-danger"
           *ngIf="form.get('password')?.hasError('minlength') && form.get('password')?.touched">
        Password must be at least 6 characters long
      </div>

      <div class="text-danger"
           *ngIf="form.get('password')?.hasError('pattern') && form.get('password')?.touched">
        Password must contain uppercase, lowercase, and a number
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm Password</label>

      <div class="input-group">
        <input
          id="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="confirmPassword"
        />

        <button
          type="button"
          class="btn-eye"
          [ngClass]="{ 'active': showConfirmPassword }"
          (click)="showConfirmPassword = !showConfirmPassword"
        >
          <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye' : 'bi-eye-slash'"></i>
        </button>
      </div>

      <div class="text-danger"
           *ngIf="form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched">
        Passwords do not match
      </div>
    </div>

    <!-- Submit -->
    <button
      class="btn btn-primary"
      type="submit"
      [disabled]="form.invalid || loading"
    >
      {{ loading ? 'Signing up...' : 'Submit' }}
    </button>

    <p class="mt-3 text-center">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>

  </form>
</div>
