<div class="container py-5">
  <h2 class="mb-4 text-center">Create your EasyFolio account</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mx-auto" style="max-width: 400px;">

    <!-- Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input id="name" type="text" class="form-control" formControlName="name">
      <div class="text-danger" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
        Name is required.
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email">

      <div class="text-danger" *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched">
        Enter a valid email address.
      </div>

      <div class="text-danger" *ngIf="form.get('email')?.hasError('pattern') && form.get('email')?.touched">
        Email must end with &#64ggc.edu
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password">

      <div class="text-danger"
           *ngIf="form.get('password')?.hasError('minlength') && form.get('password')?.touched">
        Password must be at least 6 characters long.
      </div>

      <div class="text-danger"
           *ngIf="form.get('password')?.hasError('pattern') && form.get('password')?.touched">
        Password must contain uppercase, lowercase, and a number.
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword">

      <div class="text-danger"
           *ngIf="form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched">
        Passwords do not match.
      </div>
    </div>

    <!-- Submit -->
    <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Signing up...' : 'Sign Up' }}
    </button>

    <p class="mt-3 text-center">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>
  </form>
</div>
