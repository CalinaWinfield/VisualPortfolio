<div class="container-fluid">
  <div class="row">
    <div class="container-fluid">
      <div class="row">
         <div class="container-fluid d-flex justify-content-between align-items-center mt-4 mb-2">
              <h1 class="Dashboard-Title m-0">Document Builder</h1>
                <div class="search-container" style="width: 250px;">
                <input type="text" class="form-control search-bar" placeholder="Search">
                </div>
            </div> 
        
   </div>
   <hr class="border border-secondary">
</div>
<div class="container-fluid"> <!-- Full-width container -->
    <div class="row justify-content-center py-4">

        <!-- Left Document -->
        <div class="builder-wrapper">
            <div class="container">
              <div class="row justify-content-center align-items-start g-5">

                <!-- Item List -->
<div class="col-lg-6 col-md-8 mb-4">
    <div class="p-4 border rounded bg-white shadow builder-card">
      <h4 class="mb-3 docTitle">Item List:</h4>
      <div id="left" class="drag-container">
        <!-- Draggable items will load here -->
      </div>
    </div>
  </div>

  <!-- Document Builder -->
  <div class="col-lg-6 col-md-8 mb-4">
    <div class="p-4 border rounded bg-white shadow builder-card">
      <h4 class="mb-3 docTitle">Document Builder:</h4>
      <div id="right" class="drag-container">
        <p class="text-muted">Drag list items here</p>
      </div>
      <button class="btn formatbtn mt-3">
        <i class="bi bi-gear-fill"></i> Format
      </button>
    </div>
  </div>

              </div>
            </div>
          </div>

    </div> <!-- End Main Content -->
</div> <!-- End Container-Fluid -->
<!-- Footer -->
<footer class="footer">
  <div class="container">
    <p>&copy; <span id="current-year"></span> Visual Portfolio. All rights reserved.</p>
  </div>
</footer>
<script>
    document.addEventListener("DOMContentLoaded", function () {
      const leftBox = document.getElementById("left");
      const rightBox = document.getElementById("right");

      enableDragAndDrop(leftBox);
      enableDragAndDrop(rightBox);
      loadItems();

      // FORMAT BUTTON
      document.querySelector(".formatbtn").addEventListener("click", function () {
        const droppedItems = rightBox.querySelectorAll(".list");

        let output = "<div class='resume-output'>";
        droppedItems.forEach(item => {
          const title = item.dataset.title;
          const description = item.dataset.description;
          output += `<h5>${title}</h5><p>${description}</p>`;
        });
        output += "</div>";

        rightBox.innerHTML = output;
      });
    });

    function enableDragAndDrop(container) {
      container.addEventListener("dragover", function (e) {
        e.preventDefault();
      });

      container.addEventListener("drop", function (e) {
        e.preventDefault();
        const draggedItem = document.querySelector(".dragging");
        if (draggedItem) {
          container.appendChild(draggedItem);
          draggedItem.classList.remove("dragging");
        }
      });
    }

    async function loadItems() {
        try {
          const sessionUserEmail = sessionStorage.getItem('userEmail');
           //was once if (!userId)
          if (!sessionUserEmail) {
            console.log("No user email found in sessionStorage");
            return;
          }

          const response = await fetch("http://localhost:5001/api/items");
          const items = await response.json();

          const leftContainer = document.getElementById("left");
          leftContainer.innerHTML = "";

          const filteredItems = items.filter(item => item.userEmail === sessionUserEmail);
          console.log("Filtered Items:", filteredItems);

          filteredItems.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "list";
            div.draggable = true;
            div.id = `item-${index}`;
            div.dataset.title = item.itemTitle;
            div.dataset.description = item.itemDescription;

            div.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <span><img src="../../assets/img/foxIcon1.png" style="width: 20px; margin-right: 5px;"> ${item.itemTitle}</span>
                    <button class="btn btn-sm delete-btn" data-id="${item._id}" style="margin-left:
               10px; color: white; background: none; border: none; font-size: 1.2rem;">×</button>
                </div>
            `;

            addDragEvents(div);
            leftContainer.appendChild(div);

            const deleteBtn = div.querySelector(".delete-btn");
            deleteBtn.addEventListener("click", async function (e) {
              e.stopPropagation();
              const itemId = this.getAttribute("data-id");

              if (confirm("Are you sure you want to delete this item?")) {
                try {
                  const response = await fetch(`http://localhost:5001/api/items/${itemId}`, {
                    method: "DELETE"
                  });

                  if (response.ok) {
                    alert("Item deleted successfully!");
                    loadItems();
                  } else {
                    alert("Failed to delete item.");
                  }
                } catch (err) {
                  console.error("Delete error:", err);
                  alert("Error deleting item.");
                }
              }
            });
          });
        } catch (error) {
          console.error("Error loading items:", error);
        }
    }

    function addDragEvents(element) {
      element.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", e.target.id);
        setTimeout(() => e.target.classList.add("dragging"), 0);
      });

      element.addEventListener("dragend", function (e) {
        e.target.classList.remove("dragging");
      });
    }
  </script>


</body>
</html>
