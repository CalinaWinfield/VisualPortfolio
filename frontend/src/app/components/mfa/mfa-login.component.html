<div class="mfa-login-wrapper">
  <h2 class ="title">
    MFA Verification</h2>

  <p>Enter the 6‑digit code from your authenticator app.</p>

  <input
    type="text"
    maxlength="6"
    [(ngModel)]="code"
    placeholder="123456"
  />

  <button class="btn-primary" (click)="submitCode()">Verify</button>
  <button class="btn-secondary" type="button" (click)="resetMfa()" [disabled]="resetting">
    {{ resetting ? 'Resetting...' : 'Reset MFA and Re-enroll' }}
  </button>

  <div class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
</div>
