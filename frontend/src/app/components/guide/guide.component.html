
<div class="guide-wrapper">
  <div class="guide-grid">

    <h1 class="guide-title">User Guide</h1>

    <div class="guide-item" *ngFor="let step of steps; let i = index">

      <button class="guide-header" (click)="toggleStep(i)">
        <span class="step-number">{{ i + 1 }}</span>
        <span class="step-title">{{ step.title }}</span>
        <span class="chevron" [class.open]="step.open">⌄</span>
      </button>

      <div
        class="guide-content"
        [class.open]="step.open"
        [innerHTML]="step.content">
      </div>
    </div>
  </div>
</div>
