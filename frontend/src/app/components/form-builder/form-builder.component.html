<div class="form-builder-page">
  <div class="builder-layout">
    <div
      class="item-panel"
      cdkDropList
      [cdkDropListData]="items"
      (cdkDropListDropped)="dropItem($event)"
    >
      <h3>Your Items</h3>

      <div
        class="item-card"
        *ngFor="let item of items"
        cdkDrag
      >
        {{ item.itemTitle }}
      </div>
    </div>

    <div class="builder-shell">
      <div class="header-section">
        <h2>Document Builder</h2>
        <p class="builder-sub">Drag elements to build your document</p>

        <div class="action-bar">
          <button
            class="btn"
            (click)="togglePreview()"
            [disabled]="!editor"
          >
            {{ isPreviewMode ? '✏️ Back to Editor' : '👁️ Preview' }}
          </button>

          <button
            class="btn"
            (click)="saveForm()"
            [disabled]="!editor"
          >
            💾 Save Form
          </button>
        </div>
      </div>

      <div
        *ngIf="!isPreviewMode"
        #formeoContainer
        class="formeo-container"
        formeoDropzone
        (itemDropped)="handleSectionDrop($event)"
      ></div>
      <div *ngIf="isPreviewMode" #formeoRenderer class="formeo-renderer"></div>
    </div>
  </div>
</div>
