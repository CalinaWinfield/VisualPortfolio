<div class="expandable-form-container">



  <!-- FORM (toggle open, not replace UI) -->
  <form [formGroup]="form" (ngSubmit)="save()" class="compact-form">

    <div class="form-grid">

      <div class="form-group">
        <label>Category</label>
        <input class="form-control" formControlName="category" />
      </div>

      <div class="form-group">
        <label>Title</label>
        <input class="form-control" formControlName="itemTitle" />
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" class="form-control" formControlName="itemDate" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" formControlName="userEmail" />
      </div>

    </div>

    <!-- FULL WIDTH -->
    <div class="form-group full-width">
      <label>Description</label>
      <textarea rows="2" class="form-control" formControlName="itemDescription"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit"
              class="btn btn-success"
              [disabled]="form.invalid || isSubmitting">
        {{ isSubmitting ? 'Submitting...' : 'Submit' }}
      </button>
    </div>
  </form>

  <!-- ITEMS LIST -->
  <div *ngIf="items?.length" class="mt-4">
    <h4>Existing Items</h4>

    <ul class="item-grid">
      <li class="item-card" *ngFor="let it of items">
        <div class="title">{{ it.itemTitle }}</div>

        <div class="meta">
          <span class="chip">{{ it.category || 'No category' }}</span>
          <span>{{ it.itemDate }}</span>
        </div>

        <div class="desc">{{ it.itemDescription }}</div>

        <div class="row mt-2">
          <button class="btn btn-link" (click)="prefillFrom(it)">
            Prefill
          </button>

          <button class="btn btn-link text-danger" (click)="remove(it._id)">
            Delete
          </button>
        </div>
      </li>
    </ul>
  </div>

</div>
