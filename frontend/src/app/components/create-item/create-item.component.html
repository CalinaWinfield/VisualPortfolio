<div class="createItem-wrapper">
  <!-- FORM toggle open-->
  <form [formGroup]="form" (ngSubmit)="save()" class="compact-form">

    <div class="form-grid">

      <div class="form-group">
        <label for="itemTitle">Title</label>
        <input id="itemTitle" class="form-control" formControlName="itemTitle" placeholder="e.g. Software Engineer, B.S. Computer Science" />
      </div>

      <div class="form-group">
        <label for="categorySelect">Category</label>
        <select id="categorySelect" class="form-control form-select" formControlName="category">
          <option value="" disabled>Select a category</option>
          <option *ngFor="let cat of categoryOptions" [value]="cat">{{ cat }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemDate">Date</label>
        <input id="itemDate" type="date" class="form-control" formControlName="itemDate" />
      </div>

      <div class="form-group">
        <label for="userEmail">Email</label>
        <input id="userEmail" type="email" class="form-control" formControlName="userEmail" placeholder="name@example.com" />
      </div>

    </div>

    <!-- FULL WIDTH -->
    <div class="form-group full-width">
      <label for="itemDescription">Description</label>
      <textarea id="itemDescription" rows="3" class="form-control" formControlName="itemDescription" placeholder="Provide details, responsibilities, or achievements..."></textarea>
    </div>

    <div class="form-actions">
      <button type="submit"
              class="btn btn-success"
              [disabled]="form.invalid || isSubmitting">
        {{ isSubmitting ? 'Saving...' : (selectedItem ? 'Update Item' : 'Save Item') }}
      </button>
    </div>
  </form>
</div>
