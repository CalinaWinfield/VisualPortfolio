    <!-- Angular Create Item Root -->
    <app-item-form></app-item-form>

     <div class="expandable-form-container">
      <!-- First Form -->
      <form id="firstForm" class="p-4 border rounded bg-white shadow w-75 mx-auto">
          <div class="form-row">
              <div class="form-group mb-3">
                  <input type="button" value="CREATE" id="createBtn" class="btn btn-primary btn-block form-control createButton"/>
              </div>

              <div class="form-group">
                  <input type="reset" value="UPDATE" class="btn btn-secondary btn-block form-control updateButton"/>
              </div>
          </div>
      </form>

      <!-- Second form hidden until triggered -->
      <form id="secondForm" class="p-4 border rounded bg-white shadow w-75 mx-auto">
          <div class="form-group mb-4">
              <label for="itemTitle">Item:</label>
              <input type="text" name="itemTitle" id="itemTitle" class="form-control"/>
              <label for="itemType">Type:</label>
              <input type="text" name="itemType" id="itemType" class="form-control"/><br>
              <label for="itemDate">Date:</label>
              <input type="month" name="itemData" id="itemDate"/><br><br>
              <label for="itemDescription">Description:</label>
              <textarea name="itemDescription" id="itemDescription" rows="4" cols="50" class="form-control"></textarea>
          </div>
<!--
           Subgroups Container
          <div id="subgroupsContainer"></div>

          <div class="form-group mb-4">
              <input type="button" value="Add Subgroup" id="addSubBtn" class="btn btn-primary btn-block form-control addSubgroup"/>
          </div>
-->
          <!-- Centered Submit Button -->
          <div class="text-center">
              <button type="submit" class="btn btn-success mt-3 submit" style="width: 50%;">Submit</button>
          </div>
      </form>
  </div>

  <script>
  document.getElementById("createBtn").addEventListener("click", function () {
      document.getElementById("firstForm").style.display = "none"; // Hide first form
      document.getElementById("secondForm").style.display = "block"; // Show second form
  });

  document.getElementById("addSubBtn").addEventListener("click", function () {
      const subgroupsContainer = document.getElementById("subgroupsContainer");

      const subgroupDiv = document.createElement("div");
      subgroupDiv.classList.add("subgroup");

      subgroupDiv.innerHTML = `
          <label class="form-label">Subgroup Name (Optional)</label>
          <input type="text" class="form-control mb-2" placeholder="Enter subgroup name">

          <label class="form-label">Items</label>
          <textarea class="form-control mb-2" rows="3" placeholder="Enter items"></textarea>

          <button type="button" class="btn btn-danger btn-sm remove-btn">❌ Remove</button>
      `;

      subgroupsContainer.appendChild(subgroupDiv);

      // Attach event listener to remove the subgroup
      subgroupDiv.querySelector(".remove-btn").addEventListener("click", function() {
          subgroupDiv.remove();
      });
  });


  </script>
