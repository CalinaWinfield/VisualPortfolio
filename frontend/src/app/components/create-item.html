<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Item</title>
  <link rel="stylesheet" href="../../assets/css/Dashboard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    .expandable-form-container {
      padding: 20px;
      border-radius: 10px;
      width: 50%;
      margin: auto;
    }
    .createButton {
      background-color: #5d81bc;
    }
    .createButton:hover {
      background-color: #5d81bca2;
    }
    .createButton:active {
      background-color: #5d81bc88 !important;
    }
    .updateButton {
      background-color: #f5a3ad;
    }
    .updateButton:hover {
      background-color: #f5a3ad94;
    }
    .updateButton:active {
      background-color: #f5a3ad71 !important;
    }
    #itemForm {
      background-color: #d1e7fd;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid gray;
      display: none;
    }
  </style>
</head>

<body>
  <div class="expandable-form-container">
    <!-- Trigger Form -->
    <form id="firstForm" class="p-4 border rounded bg-white shadow w-75 mx-auto">
      <div class="form-row">
        <div class="form-group mb-3">
          <input type="button" value="CREATE" id="createBtn" class="btn btn-primary btn-block form-control createButton"/>
        </div>
        <div class="form-group">
          <input type="reset" value="UPDATE" class="btn btn-secondary btn-block form-control updateButton"/>
        </div>
      </div>
    </form>

    <!-- Actual Create Item Form -->
    <form id="itemForm" class="p-4 border rounded bg-white shadow w-75 mx-auto">
      <div class="form-group mb-4">
        <label for="category">Category:</label>
        <input type="text" name="category" id="category" class="form-control" required>
      </div>

      <div class="form-group mb-4">
        <label for="itemTitle">Title:</label>
        <input type="text" name="itemTitle" id="itemTitle" class="form-control" required>
      </div>

      <div class="form-group mb-4">
        <label for="itemDate">Date:</label>
        <input type="date" name="itemDate" id="itemDate" class="form-control" required>
      </div>

      <div class="form-group mb-4">
        <label for="itemDescription">Description:</label>
        <textarea name="itemDescription" id="itemDescription" class="form-control" rows="3" required></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success mt-3" style="width: 50%;">Submit</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("createBtn").addEventListener("click", function () {
      document.getElementById("firstForm").style.display = "none";
      document.getElementById("itemForm").style.display = "block";
    });

    document.addEventListener('DOMContentLoaded', function () {
      const itemForm = document.getElementById('itemForm');

      itemForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        const category = document.getElementById('category').value;
        const itemTitle = document.getElementById('itemTitle').value;
        const itemDate = document.getElementById('itemDate').value;
        const itemDescription = document.getElementById('itemDescription').value;
        const userID = sessionStorage.getItem('userID');

        try {
          const response = await fetch('http://localhost:5001/api/items/create-item', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              category,
              itemTitle,
              itemDate,
              itemDescription,
              userID
            })
          });

          const data = await response.json();
          if (response.ok) {
            alert('Item created successfully!');
            window.location.href = 'app/components/Dashboard.html';
          } else {
            alert('Item creation failed: ' + data.error);
          }
        } catch (error) {
          console.error('Error:', error);
          alert('An error occurred during item creation');
        }
      });
    });
  </script>
</body>
</html>
