<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Item</title>
  <link rel="icon" type="image/x-icon" href="../../assets/img/foxIcon1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/frontend/src/assets/css/global.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      /* Makes main take up remaining space so footer stays at bottom */
    }

    .footer {
      background-color: #f5a3ad;
      color: #fff;
      text-align: center;
      padding: 10px 0;
    }

    .expandable-form-container {
      padding: 20px;
      border-radius: 10px;
      width: 50%;
      margin: auto;
    }

    .createButton {
      background-color: #f5a3ad;
      font-size: 24px;
      
    }

    .createButton:hover {
      background-color: #f5a3ad94;
    }

    .createButton:active {
      background-color: #f5a3ad !important;
    }

    .updateButton {
      background-color: #f5a3ad;
      font-size: 24px;
    }

    .updateButton:hover {
      background-color: #f5a3ad94;
    }

    .updateButton:active {
      background-color: #f5a3ad71 !important;
    }

    #itemForm {
      background-color: #d1e7fd;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid gray;
      display: none;
    }

    .center-form-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background-color: #00243a;
    }
  </style>
</head>

<body class="create-item-page">
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-pink">
      <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="../../assets/img/foxIcon.png" alt="Visual Portfolio Logo" style="height:28px; margin-right:10px;">
          VISUAL PORTFOLIO
        </a>

        <!-- Hamburger toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse justify-content-end text-center" id="navbarNav">
          <!-- <div class="search-container" style="width: 250px;">
                  <input type="text" class="form-control search-bar" placeholder="Search">
              </div> -->
              <br>

          <ul class="navbar-nav">
            <li>
                <div class="justify-content-center align-items-center search-container" style="width: 260px; position:absolute; left:50%; transform:translateX(-50%);">
                  <input type="text" class="form-control search-bar" placeholder="Search">
              </div>
              <br>
              <br>
            </li>
            
            <li><a class="nav-link" href="Dashboard.html">Dashboard</a></li>
            <li><a class="nav-link" href="guide.html">Guide</a></li>
            <li><a class="nav-link" href="about.html">About</a></li>
            <li><a class="nav-link" href="../../index.html">Log out</a></li>
            
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    <div class="container-fluid">
      <div class="row">
        <main class="col-12 px-md-4 text-white">
          <div class="container-fluid d-flex justify-content-between align-items-center mt-4 mb-2" style="border-color: pink">
            <h1 class="Dashboard-Title text-center w-100 m-0 ">Create Item</h1>
          </div>
          <hr class="border border-secondary">
        </main>

        <div class="expandable-form-container">
          <!-- Trigger Form -->
          <form id="firstForm" class="py-2 w-50 mx-auto text-center">
            <div class="form-row">
              <div class="form-group mb-3">
                <input type="button" value="Add Item" id="createBtn"
                  class="btn btn-primary btn-block form-control createButton" />
              </div>
            </div>
          </form>

          

        <div class="container my-4">
          <div class="row justify-content-center g-4">
              <!-- My Documents -->
          <!-- <div class="col-md-5">
             <div class="card shadow">
                <div class="card-header custom-card-header">My Documents</div>
                  <div class="card-body">
                    <p class="text-muted mb-3">View stored documents.</p>
                    <a routerLink="/document-builder" class="btn btn-primary bg-pink">Open Documents</a>
                   </div>
                 </div>
                </div> -->
                <div class="card shadow col-md-5" role="button"
                    data-bs-toggle="collapse" data-bs-target="#myDocsSection"
                        aria-expanded="false" aria-controls="myDocsSection">
                  <div class=" card-header custom-card-header">My Documents</div>
                    <div class="card-body">
                      <p class="text-muted">View stored documents.</p>
                      <a routerLink="/document-builder" class="btn btn-primary bg-pink">Open Documents</a>
                    </div>
                </div>

                <!-- Document Builder -->
         <div class="col-md-5">
            <div class="card shadow">
              <div class="card-header custom-card-header">Document Builder</div>
               <div class="card-body">
                 <p class="text-muted">Build a document from a template.</p>
                 <a routerLink="/document-builder" class="btn btn-primary bg-pink">Build a Document</a>
                 </div>
                </div>
              </div>
            </div>
          </div>

              <div id="myDocsSection" class="collapse mt-2  col-md-5">
                <div class="card card-body">
                  <!-- your folders/list go here -->
                  <div class="d-flex gap-3 col-md-5">
                  <div class="folder text-center">
                  <img src="../../assets/img/folder-svgrepo-com.svg" style="width:80px;height:80px" class="img-fluid">
                  <p class="m-0 folderTxt color: #000000">Resumes</p>
                  </div>
                  <!-- ... -->
                  </div>
                </div>
              </div>
          

          <!-- Actual Create Item Form -->
          <form id="itemForm" class="p-4 border rounded bg-white shadow w-75 mx-auto">
            <div class="form-group mb-4">
              <label for="folder">Folder:</label>
              <input type="text" name="folder" id="folder" class="form-control" required placeholder="Folder">
            </div>

            <div class="form-group mb-4">
              <label for="itemTitle">Title:</label>
              <input type="text" name="itemTitle" id="itemTitle" class="form-control" required placeholder="Title">
            </div>

            <div class="form-group mb-4">
              <label for="itemDate">Date:</label>
              <input type="date" name="itemDate" id="itemDate" class="form-control" required>
            </div>

            <div class="form-group mb-4">
              <label for="itemDescription">Description:</label>
              <textarea name="itemDescription" id="itemDescription" class="form-control" rows="3" required
                placeholder="Description"></textarea>
            </div>

            <div class="text-center">
              <button type="submit" class="btn btn-success mt-3" style="width: 50%;">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> Visual Portfolio. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Keep footer year current
    document.getElementById("current-year").textContent = new Date().getFullYear();

    // Show/Hide form
    document.getElementById("createBtn").addEventListener("click", function () {
      document.getElementById("firstForm").style.display = "none";
      document.getElementById("itemForm").style.display = "block";
    });
  </script>
</body>

</html>
