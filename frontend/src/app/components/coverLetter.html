<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/document.css">
	<link rel="icon" type="image/x-icon" href="../../assets/img/foxIcon1.png">
</head>
<body>
    <div class="dashboard container-fluid">
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="mobile-header d-md-none text-center py-3">
            <!-- Logo -->
            <div class="logo"><img src="../../assets/img/foxIcon.png" alt="Visual Portfolio Logo" class="img-fluid"></div>
            <!-- User Profile -->
            <div class="user-profile">
                <div class="profile-picture mx-auto"></div> <!-- Placeholder for profile picture -->
                <div class="user-details mt-2">
                    <p class="user-name fw-bold mb-0">User Name</p>
                    <p class="user-email mb-0">user@example.com</p>
                </div>
            </div>
            <!-- Menu Toggle Button -->
            <button class="btn btn-primary mt-3" id="menu-toggle">Menu</button>
            <!-- Mobile Menu (Hidden by default) -->
            <div class="mobile-menu d-none mt-3" id="mobile-menu">
                <ul class="list-unstyled">                    
                    <li class="mb-3"><a href="#" class="text-decoration-none">Dashboard</a></li>
					<li class="mb-3"><a href="../../index.html" class="text-decoration-none">Log out</a></li>
                </ul>
            </div>
        </header>

			
            <!-- Main Section
				use this section to add the resume building properties
				also use the left pane above to add drag and drop features, you can delete the profile info to work with the space 
				just leave the Dashboard and logout buttons, this pages are using MainStyles.css so add or reuse any existing id's fo yout styling. 
				if creating a new styling id make sure is not a repeated name.

			-->
            <main class="main-section col-md-8 col-12">
                <!-- Greeting -->
                <h1 class="greeting mb-4">Let's build your Cover Letter</h1>

                <!-- Template Selection -->
                <div class="template-selection mb-4">
                    <h2>Choose a Template</h2>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="template-card">
                                <img src="../../assets/img/cover1.png" alt="Template 1" class="img-fluid">
                                <button class="btn btn-primary mt-2 covbtn">Use This Template</button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="template-card">
                                <img src="../../assets/img/cover2.png" alt="Template 2" class="img-fluid">
                                <button class="btn btn-primary mt-2 covbtn">Use This Template</button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="template-card">
                                <img src="../../assets/img/cover3.png" alt="Template 3" class="img-fluid">
                                <button class="btn btn-primary mt-2 covbtn">Use This Template</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cover Letter Editor -->
                <div class="cover-letter-editor">
                    <h2>Your Cover Letter</h2>
                    <textarea class="form-control mb-3" rows="5" placeholder="Introduction..."></textarea>
                    <textarea class="form-control mb-3" rows="5" placeholder="Body..."></textarea>
                    <textarea class="form-control mb-3" rows="5" placeholder="Conclusion..."></textarea>
                    <button class="btn btn-success">Save</button>
                    <button class="btn btn-primary">Preview</button>
                    <button class="btn btn-secondary">Export as PDF</button>
                </div>
               
            </main>




    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Custom JS (removed for event loading issue) -->
    <script src="../../../../backend/controller/scriptMainREMOVED.js"></script>
</body>
</html>
