<div class="dashboard-wrapper">

  <!-- HEADER -->
  <div class="dashboard-header">
    <h1 class="dashboard-title">Dashboard</h1>

    <div class="dashboard-search">
      <input type="text"
             class="search-input"
             placeholder="Search documents, items..." />
    </div>
  </div>
</div>

  <!-- CARDS GRID -->
  <div class="dashboard-grid">

    <!-- ITEMS CARD -->
    <div class="dashboard-card"
         (click)="toggleCard('items')">

      <h3>Items</h3>
      <p>Create, view and edit items.</p>

      <div class="card-expand"
           [hidden]="activeCard !== 'items'"
           (click)="$event.stopPropagation()">

        <div class="card-actions">

          <button (click)="toggleForm(); $event.stopPropagation()">
            + Create Item
          </button>

          <button (click)="openViewItems(); $event.stopPropagation()">
            View Items
          </button>

        </div>

      </div>
    </div>

    <!-- DOCUMENT BUILDER -->
    <div class="dashboard-card">
      <h3>Document Builder</h3>
      <p>Drag and drop to create custom documents.</p>
    </div>

    <!-- MY DOCUMENTS -->
    <div class="dashboard-card">
      <h3>My Documents</h3>
      <p>View and edit saved documents.</p>
    </div>

  </div>

  <!-- CATEGORIES -->
  <div class="category-section" *ngIf="categories.length">
    <h3 class="category-title">Folders</h3>

    <div class="category-list">
      <div class="category-card"
           *ngFor="let cat of categories">
        📁 {{ cat }}
      </div>
    </div>
  </div>

  <!-- FORM SECTION -->
  <div class="form-section" [hidden]="!showForm">

    <div class="form-header">
      <h2 class="form-title">
        {{ selectedItem ? 'Edit Item' : 'Create New Item' }}
      </h2>
      <button class="close-btn" (click)="closeForm()">✕</button>
    </div>

    <app-create-item
      [prefillData]="selectedItem"
      (itemCreated)="onItemCreated()">
    </app-create-item>

  </div>

  <!-- ✅ VIEW SECTION (FIXED POSITION) -->
  <div class="view-section" [hidden]="!viewItemsMode">

    <h2>All Items</h2>

    <app-items-list
      *ngIf="viewItemsMode"
      [items]="pagedItems"
      (prefillClicked)="prefillItem($event)">
    </app-items-list>


  </div>
