<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Letter Builder</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="MainStyles.css">
    <link rel="icon" type="image/x-icon" href="../img/foxIcon1.png">
</head>
<body>
    <div class="dashboard container-fluid">
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="mobile-header d-md-none text-center py-3">
            <!-- Logo -->
            <div class="logo"><img src="../img/foxIcon.png" alt="Visual Portfolio Logo" class="img-fluid"></div>
            <!-- Menu Toggle Button -->
            <button class="btn btn-primary mt-3" id="menu-toggle">Menu</button>
            <!-- Mobile Menu (Hidden by default) -->
            <div class="mobile-menu d-none mt-3" id="mobile-menu">
                <ul class="list-unstyled">                    
                    <li class="mb-3"><a href="main.html" class="text-decoration-none">Dashboard</a></li>
                    <li class="mb-3"><a href="index.html" class="text-decoration-none">Log out</a></li>
                </ul>
            </div>
        </header>

        <div class="row">
            <!-- Left Pane (Hidden on Mobile, Visible on Desktop) -->
            <aside class="left-pane col-md-2 d-none d-md-block">
                <!-- Logo -->
                <div class="logo text-center py-4">
                    <img src="../img/foxIcon.png" alt="Visual Portfolio Logo" class="img-fluid">
                    <span>Visual Portfolio</span>
                </div>
                <!-- Navigation Menu -->
                <nav class="menu">
                    <ul class="list-unstyled">
                        <li class="mb-4"><a href="main.html" class="text-decoration-none">Dashboard</a></li>
                        <li class="mb-4"><a href="index.html" class="text-decoration-none">Log out</a></li>
                    </ul>
                </nav>
            </aside>

            <!-- Main Section -->
            <main class="main-section col-md-8 col-12">
                <!-- Greeting -->
                <h1 class="greeting mb-4">Let's Build Your Cover Letter</h1>

                <!-- Template Selection -->
                <div class="template-selection mb-4">
                    <h2>Choose a Template</h2>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="template-card">
                                <img src="../img/cover1.png" alt="Template 1" class="img-fluid">
                                <button class="btn btn-primary mt-2">Use This Template</button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="template-card">
                                <img src="../img/cover2.png" alt="Template 2" class="img-fluid">
                                <button class="btn btn-primary mt-2">Use This Template</button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="template-card">
                                <img src="../img/cover3.png" alt="Template 3" class="img-fluid">
                                <button class="btn btn-primary mt-2">Use This Template</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cover Letter Editor -->
                <div class="cover-letter-editor">
                    <h2>Your Cover Letter</h2>
                    <textarea class="form-control mb-3" rows="5" placeholder="Introduction..."></textarea>
                    <textarea class="form-control mb-3" rows="5" placeholder="Body..."></textarea>
                    <textarea class="form-control mb-3" rows="5" placeholder="Conclusion..."></textarea>
                    <button class="btn btn-success">Save</button>
                    <button class="btn btn-primary">Preview</button>
                    <button class="btn btn-secondary">Export as PDF</button>
                </div>
            </main>

            <!-- Right Pane (Categories) -->
            <aside class="right-pane col-md-2">
                <!-- Categories Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">Categories</h2>
                </div>
                <!-- Categories List -->
                <div class="categories-list">
                    <!-- Resumes -->
                    <div class="category mb-4">
                        <h3 class="category-title">Resumes</h3>
                        <ul class="list-unstyled">
                            <li><a href="#" class="text-decoration-none">Resume 1</a></li>
                            <li><a href="#" class="text-decoration-none">Resume 2</a></li>
                            <li><a href="#" class="text-decoration-none">Resume 3</a></li>
                        </ul>
                    </div>
                    <!-- Portfolios -->
                    <div class="category mb-4">
                        <h3 class="category-title">Portfolios</h3>
                        <ul class="list-unstyled">
                            <li><a href="#" class="text-decoration-none">Portfolio 1</a></li>
                            <li><a href="#" class="text-decoration-none">Portfolio 2</a></li>
                            <li><a href="#" class="text-decoration-none">Portfolio 3</a></li>
                        </ul>
                    </div>
                    <!-- CVs -->
                    <div class="category mb-4">
                        <h3 class="category-title">CVs</h3>
                        <ul class="list-unstyled">
                            <li><a href="#" class="text-decoration-none">CV 1</a></li>
                            <li><a href="#" class="text-decoration-none">CV 2</a></li>
                            <li><a href="#" class="text-decoration-none">CV 3</a></li>
                        </ul>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="../controller/scriptMain.js"></script>
</body>
</html>
