<!--David Flores-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="MainStyles.css">
	<link rel="icon" type="image/x-icon" href="../img/foxIcon1.png">
</head>
<body>
    <div class="dashboard container-fluid">
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="mobile-header d-md-none text-center py-3">
            <!-- Logo -->
            <div class="logo"><img src="../img/foxIcon.png" alt="Visual Portfolio Logo" class="img-fluid"></div>
            <!-- User Profile -->
            <div class="user-profile">
                <div class="profile-picture mx-auto"></div> <!-- Placeholder for profile picture -->
                <div class="user-details mt-2">
                    <p class="user-name fw-bold mb-0">User Name</p>
                    <p class="user-email mb-0">user@example.com</p>
                </div>
            </div>
            <!-- Menu Toggle Button -->
            <button class="btn btn-primary mt-3" id="menu-toggle">Menu</button>
            <!-- Mobile Menu (Hidden by default) -->
            <div class="mobile-menu d-none mt-3" id="mobile-menu">
                <ul class="list-unstyled">                    
                    <li class="mb-3"><a href="#" class="text-decoration-none" id="schedule-btn">Schedule</a></li>
                    <li class="mb-3"><a href="#" class="text-decoration-none">Documents</a></li>
                    <li class="mb-3"><a href="#" class="text-decoration-none">Settings</a></li>
					<li class="mb-3"><a href="index.html" class="text-decoration-none">Log out</a></li>
                </ul>
            </div>
        </header>

        <div class="row">
            <!-- Left Pane (Hidden on Mobile, Visible on Desktop) -->
            <aside class="left-pane col-md-2 d-none d-md-block">
                <!-- Logo -->
                <div class="logo text-center py-4"><img src="../img/foxIcon.png" alt="Visual Portfolio Logo" class="img-fluid">Visual Porfolio</div>
                <!-- User Profile -->
                <div class="user-profile text-center mb-5">
                    <div class="profile-picture mx-auto"></div> <!-- Placeholder for profile picture -->
                    <div class="user-details mt-3">
                        <p class="user-name fw-bold">User Name</p>
                        <p class="user-email">user@example.com</p>
                    </div>
                </div>
                <!-- Navigation Menu -->
                <nav class="menu">
                    <ul class="list-unstyled">
                        <li class="mb-4"><a href="#" class="text-decoration-none">Documents</a></li>
                        <li class="mb-4"><a href="#" class="text-decoration-none">Settings</a></li>
						<li class="mb-4"><a href="index.html" class="text-decoration-none">Log out</a></li>
                    </ul>
                </nav>
            </aside>
			
            <!-- Main Section -->
            <main class="main-section col-md-8 col-12">
                <!-- Greeting -->
                <h1 class="greeting mb-4">Hello, <span id="username">User Name</span></h1>
                <!-- Quick Actions -->
                <div class="quick-actions row g-4">
                    <div class="action col-md-3 col-sm-6">
						<a href="Edit_page.html" class="text-decoration-none">
                        <div class="action-content rounded-4 p-3">Create New Project</div></a>
                    </div>
                    <div class="action col-md-3 col-sm-6">
                        <div class="action-content rounded-4 p-3">My Portfolio</div>
                    </div>
                    <div class="action col-md-3 col-sm-6">
                        <div class="action-content rounded-4 p-3">My Resumes</div>
                    </div>
                    <div class="action col-md-3 col-sm-6">
						<a href="document.html" class="text-decoration-none">
                        <div class="action-content rounded-4 p-3">Layouts</div></a>
                    </div>
                    <button id="addButton" class="btn btn-primary">Quick Links +</button>
						<div id="buttonContainer" class="mt-3"></div>
					</div>
            </main>

            <!-- Right Pane (Calendar) -->
            <aside class="right-pane" id="calendar-pane">
                <!-- Calendar Header with + Button -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">Calendar</h2>
                    <button class="btn btn-sm btn-primary" id="add-event-btn">+</button>
                </div>
                <!-- Calendar Events -->
                <div class="events" id="calendar-events">
                    <!-- Calendar events will be dynamically populated here -->
                </div>
            </aside>
        </div>
    </div>
<!-- Modal -->
<div class="modal fade" id="addButtonModal" tabindex="-1" aria-labelledby="addButtonModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addButtonModalLabel">Create a New Button</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="buttonForm">
          <div class="mb-3">
            <label for="buttonName" class="form-label">Button Name</label>
            <input type="text" class="form-control" id="buttonName" required>
          </div>
          <div class="mb-3">
            <label for="buttonLink" class="form-label">Website Link</label>
            <input type="url" class="form-control" id="buttonLink" required>
          </div>
          <button type="submit" class="btn btn-primary">Add Button</button>
        </form>
      </div>
    </div>
  </div>
</div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="../controller/scriptMain.js"></script>
</body>
</html>
