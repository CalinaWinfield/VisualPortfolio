<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Document</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="edit_page.css">
	
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</head>

<body>
	<!-- Ribbon -->
    <nav class="ribbon">
        <div class="page">Edit Document</div>
        <div class="btn-group">
			<div class="dropdown">
				<button class="btn btn-primary dropdown-toggle" type="button" id="fontDropdown" data-bs-toggle="dropdown" aria-expanded="false">
				 Font
				</button>
				<ul class="dropdown-menu" aria-labelledby="fontDropdown">
				  <li><a class="dropdown-item" href="#" data-font="Arial">Arial</a></li>
				  <li><a class="dropdown-item" href="#" data-font="Courier New">Courier New</a></li>
				  <li><a class="dropdown-item" href="#" data-font="Georgia">Georgia</a></li>
				  <li><a class="dropdown-item" href="#" data-font="Times New Roman">Times New Roman</a></li>
				  <li><a class="dropdown-item" href="#" data-font="Verdana">Verdana</a></li>
				</ul>
			  </div>
			  <div class="dropdown">
				<button class="btn btn-primary dropdown-toggle" type="button" id="sizeDropdown" data-bs-toggle="dropdown" aria-expanded="false">
				 Size
				</button>
				<ul class="dropdown-menu" aria-labelledby="sizeDropdown">
				  <li><a class="dropdown-item" href="#" data-size="12px">12</a></li>
				  <li><a class="dropdown-item" href="#" data-size="14px">14</a></li>
				  <li><a class="dropdown-item" href="#" data-size="16px">16</a></li>
				  <li><a class="dropdown-item" href="#" data-size="18px">18</a></li>
				  <li><a class="dropdown-item" href="#" data-size="20px">20</a></li>
				</ul>
			  </div>  
			<button type="button" class="btn btn-primary btn-custom">B</button>
			<button type="button" class="btn btn-primary btn-custom">I</button>
			<button type="button" class="btn btn-primary btn-custom">U</button>
		  </div>
		  <div class="btn-group">
			<button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Bullets</button>
			<div class="dropdown-menu">
			  <a class="dropdown-item" href="#">Point</a>
			  <a class="dropdown-item" href="#">Dash</a>
			</div>
		</div>
    </nav>

	<!-- SideBar and Document -->
	<div class="container">
		<div class="sidebar">
			<h2>Items</h2>
			<br>
			<table>
				<tbody>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
					<tr>
						<td></td>
					</tr>
				</tbody>
			</table>
			
		</div>
		<div class="content">
			<div class="document" contenteditable="true">
				<p>This is a test</p>
			</div>
		</div>

	</div>

	<script>
		// JavaScript to handle font change
		document.querySelectorAll('.dropdown-item').forEach(item => {
		  item.addEventListener('click', (e) => {
			const selectedFont = e.target.getAttribute('data-font');
			document.body.style.fontFamily = selectedFont;
		  });
		});
	</script>
	<script>
		// JavaScript to handle font change
		document.querySelectorAll('.dropdown-item').forEach(item => {
		  item.addEventListener('click', (e) => {
			const selectedSize = e.target.getAttribute('data-size');
			document.body.style.fontSize = selectedSize;
		  });
		});
	</script>

</body>
